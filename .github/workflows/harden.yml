name: LLM Hardening Pipeline

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "HuggingFace model ID to scan and harden"
        required: true
        default: "Qwen/Qwen2.5-7B-Instruct"
        type: string
      hf_org:
        description: "HuggingFace organization to publish hardened model"
        required: true
        default: "ArmyknifeLabs"
        type: string
      min_fix_rate:
        description: "Minimum fix rate to pass (0.0 - 1.0)"
        required: false
        default: "0.9"
        type: string
      evasion:
        description: "Enable evasion buffs for deeper scanning"
        required: false
        default: true
        type: boolean
      tools_version:
        description: "Release tag for armyknife tools"
        required: false
        default: "v1.7.0"
        type: string

jobs:
  harden:
    name: Scan, Harden, Verify, Publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TOOLS_VERSION: ${{ inputs.tools_version || 'v1.7.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install armyknife tools
        run: |
          RELEASE_URL="https://github.com/armyknife-social/armyknife-llm-hardening/releases/download/${TOOLS_VERSION}"

          curl -sL "${RELEASE_URL}/armyknife-llm-redteam-${TOOLS_VERSION}-linux-x86_64.tar.gz" | tar xz
          sudo mv armyknife-llm-redteam armyknife-llm-redteam-mcp /usr/local/bin/

          curl -sL "${RELEASE_URL}/securegit-v0.8.6-linux-x86_64.tar.gz" | tar xz
          sudo mv securegit securegit-mcp /usr/local/bin/

          armyknife-llm-redteam --version
          securegit --version

      - name: Run security scan
        run: |
          EVASION_FLAG=""
          if [ "${{ inputs.evasion }}" = "true" ]; then
            EVASION_FLAG="--evasion"
          fi

          armyknife-llm-redteam scan \
            --provider huggingface \
            --endpoint https://router.huggingface.co \
            --model "${{ inputs.model_id }}" \
            --api-key-env HF_TOKEN \
            --format json \
            --score \
            ${EVASION_FLAG} \
            --output scan-results/

      - name: Run full hardening pipeline
        run: |
          securegit hf full-pipeline \
            "${{ inputs.model_id }}" \
            --hf-org "${{ inputs.hf_org }}" \
            --min-fix-rate "${{ inputs.min_fix_rate }}"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan-results/
          retention-days: 90

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report/
          retention-days: 90

      - name: Check fix rate threshold
        run: |
          if [ -f verification-report/verification-report.json ]; then
            FIX_RATE=$(python3 -c "
          import json
          with open('verification-report/verification-report.json') as f:
              data = json.load(f)
          print(data.get('fix_rate', 0))
          ")
            echo "Fix rate: ${FIX_RATE}"
            python3 -c "
          fix_rate = float('${FIX_RATE}')
          threshold = float('${{ inputs.min_fix_rate }}')
          if fix_rate < threshold:
              print(f'FAIL: Fix rate {fix_rate} is below threshold {threshold}')
              exit(1)
          else:
              print(f'PASS: Fix rate {fix_rate} meets threshold {threshold}')
          "
          else
            echo "No verification report found"
            exit 1
          fi
