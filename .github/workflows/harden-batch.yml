name: "Production: Batch LLM Hardening"

on:
  workflow_dispatch:
    inputs:
      hf_org:
        description: "HuggingFace organization to publish hardened models"
        required: true
        default: "ArmyknifeLabs"
        type: string
      min_fix_rate:
        description: "Minimum fix rate to pass (0.0 - 1.0)"
        required: false
        default: "0.30"
        type: string
      evasion:
        description: "Enable evasion buffs for deeper scanning"
        required: false
        default: true
        type: boolean
      tools_version:
        description: "Release tag for armyknife tools"
        required: false
        default: "v1.6.0"
        type: string
  schedule:
    # Weekly: Monday 6am UTC
    - cron: "0 6 * * 1"

jobs:
  harden:
    name: "Harden: ${{ matrix.model_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          # Verified available on HF serverless inference (March 2026)
          - model_id: "meta-llama/Llama-3.1-8B-Instruct"
            model_name: "Llama-3.1-8B-Instruct"
          - model_id: "meta-llama/Llama-3.3-70B-Instruct"
            model_name: "Llama-3.3-70B-Instruct"
          - model_id: "meta-llama/Llama-3.2-1B-Instruct"
            model_name: "Llama-3.2-1B-Instruct"
          - model_id: "google/gemma-3-27b-it"
            model_name: "gemma-3-27b-it"
          - model_id: "Qwen/Qwen2.5-72B-Instruct"
            model_name: "Qwen2.5-72B-Instruct"
          - model_id: "Qwen/Qwen2.5-7B-Instruct"
            model_name: "Qwen2.5-7B-Instruct"
          - model_id: "Qwen/QwQ-32B"
            model_name: "QwQ-32B"
          - model_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
            model_name: "DeepSeek-R1-Distill-Qwen-32B"
          - model_id: "deepseek-ai/DeepSeek-R1"
            model_name: "DeepSeek-R1"

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TOOLS_VERSION: ${{ inputs.tools_version || 'v1.6.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install armyknife tools
        run: |
          RELEASE_URL="https://github.com/armyknife-social/armyknife-llm-hardening/releases/download/${TOOLS_VERSION}"

          curl -sL "${RELEASE_URL}/armyknife-llm-redteam-${TOOLS_VERSION}-linux-x86_64.tar.gz" | tar xz
          sudo mv armyknife-llm-redteam armyknife-llm-redteam-mcp /usr/local/bin/

          curl -sL "${RELEASE_URL}/securegit-v0.8.6-linux-x86_64.tar.gz" | tar xz
          sudo mv securegit securegit-mcp /usr/local/bin/

          armyknife-llm-redteam --version
          securegit --version

      - name: "Run security scan: ${{ matrix.model_name }}"
        run: |
          EVASION_FLAG=""
          if [ "${{ inputs.evasion || 'true' }}" = "true" ]; then
            EVASION_FLAG="--evasion"
          fi

          armyknife-llm-redteam scan \
            --provider huggingface \
            --endpoint https://router.huggingface.co \
            --model "${{ matrix.model_id }}" \
            --api-key-env HF_TOKEN \
            --format json \
            --score \
            ${EVASION_FLAG} \
            --output scan-results/

      - name: "Run hardening pipeline: ${{ matrix.model_name }}"
        run: |
          securegit hf full-pipeline \
            "${{ matrix.model_id }}" \
            --hf-org "${{ inputs.hf_org || 'ArmyknifeLabs' }}" \
            --min-fix-rate "${{ inputs.min_fix_rate || '0.30' }}"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "scan-results-${{ matrix.model_name }}"
          path: scan-results/
          retention-days: 90

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "verification-report-${{ matrix.model_name }}"
          path: verification-report/
          retention-days: 90

      - name: Write job outcome
        if: always()
        run: |
          mkdir -p job-outcome
          if [ -f verification-report/verification-report.json ]; then
            cp verification-report/verification-report.json job-outcome/report.json
          fi
          cat > job-outcome/outcome.json <<OUTCOME_EOF
          {
            "model_id": "${{ matrix.model_id }}",
            "model_name": "${{ matrix.model_name }}",
            "job_status": "${{ job.status }}"
          }
          OUTCOME_EOF

      - name: Upload job outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "job-outcome-${{ matrix.model_name }}"
          path: job-outcome/
          retention-days: 90

  summary:
    name: Batch Summary
    runs-on: ubuntu-latest
    needs: harden
    if: always()

    steps:
      - name: Download all job outcomes
        uses: actions/download-artifact@v4
        with:
          pattern: "job-outcome-*"
          path: outcomes/

      - name: Generate consolidated report
        run: |
          cat > generate_summary.py <<'PYSCRIPT'
          import json
          import os
          import glob

          models = []
          outcomes_dir = "outcomes"

          for outcome_dir in sorted(glob.glob(os.path.join(outcomes_dir, "job-outcome-*"))):
              outcome_file = os.path.join(outcome_dir, "outcome.json")
              report_file = os.path.join(outcome_dir, "report.json")

              if not os.path.exists(outcome_file):
                  continue

              with open(outcome_file) as f:
                  outcome = json.load(f)

              model = {
                  "model_id": outcome["model_id"],
                  "model_name": outcome["model_name"],
                  "job_status": outcome["job_status"],
                  "total_findings": "-",
                  "fixed": "-",
                  "regressions": "-",
                  "fix_rate": "-",
                  "verdict": "-",
              }

              if os.path.exists(report_file):
                  with open(report_file) as f:
                      report = json.load(f)
                  model["total_findings"] = report.get("total_findings", "-")
                  model["fixed"] = report.get("fixed", "-")
                  model["regressions"] = report.get("regression_count", report.get("regressions", "-"))
                  fix_rate = report.get("fix_rate")
                  if fix_rate is not None:
                      model["fix_rate"] = f"{float(fix_rate) * 100:.1f}%"
                  model["verdict"] = report.get("verdict", "-")

              models.append(model)

          # Generate markdown summary
          lines = []
          lines.append("# Batch LLM Hardening Results\n")
          lines.append(f"**Models processed:** {len(models)}")

          passed = sum(1 for m in models if m["job_status"] == "success")
          failed = sum(1 for m in models if m["job_status"] != "success")
          lines.append(f"**Passed:** {passed} | **Failed:** {failed}\n")

          lines.append("| Model | Findings | Fixed | Regressions | Fix Rate | Verdict | Status |")
          lines.append("|-------|----------|-------|-------------|----------|---------|--------|")

          for m in models:
              status_icon = "\u2705" if m["job_status"] == "success" else "\u274c"
              lines.append(
                  f"| `{m['model_name']}` "
                  f"| {m['total_findings']} "
                  f"| {m['fixed']} "
                  f"| {m['regressions']} "
                  f"| {m['fix_rate']} "
                  f"| {m['verdict']} "
                  f"| {status_icon} {m['job_status']} |"
              )

          lines.append("")

          summary_md = "\n".join(lines)

          # Write to GitHub Step Summary
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "summary.md")
          with open(summary_path, "a") as f:
              f.write(summary_md)

          # Write consolidated report artifact
          os.makedirs("batch-summary", exist_ok=True)
          with open("batch-summary/summary.md", "w") as f:
              f.write(summary_md)
          with open("batch-summary/results.json", "w") as f:
              json.dump({"models": models, "total": len(models), "passed": passed, "failed": failed}, f, indent=2)

          print(summary_md)
          PYSCRIPT
          python3 generate_summary.py

      - name: Upload batch summary
        uses: actions/upload-artifact@v4
        with:
          name: batch-summary
          path: batch-summary/
          retention-days: 90
